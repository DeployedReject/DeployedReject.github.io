<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D9D0C6"/><stop offset="0.55" stop-color="#C4B9AE"/><stop offset="1" stop-color="#A89C91"/>
  </linearGradient>
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#2b2326" stop-opacity="0.22"/>
  </linearGradient>
  <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7E746B"/><stop offset="1" stop-color="#9D9288"/>
  </linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5A4F55"/><stop offset="1" stop-color="#3A3236"/>
  </linearGradient>
  <clipPath id="clip"><path d="M 90 50 H 710 Q 760 50 760 100 V 740 Q 760 785 715 785 H 85 Q 40 785 40 740 V 100 Q 40 50 90 50 Z" /></clipPath>
</defs>
<g >
  <!-- connector plate (narrower, inset) -->
  <path d="M 150 770 H 650 V 842 Q 650 862 630 862 H 170 Q 150 862 150 842 Z" fill="url(#plate)"/>
  <g stroke="#8B7F86" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="190" y1="800" x2="190" y2="846"/><line x1="226" y1="800" x2="226" y2="846"/><line x1="262" y1="800" x2="262" y2="846"/><line x1="298" y1="800" x2="298" y2="846"/><line x1="334" y1="800" x2="334" y2="846"/><line x1="370" y1="800" x2="370" y2="846"/><line x1="406" y1="800" x2="406" y2="846"/><line x1="442" y1="800" x2="442" y2="846"/><line x1="478" y1="800" x2="478" y2="846"/><line x1="514" y1="800" x2="514" y2="846"/><line x1="550" y1="800" x2="550" y2="846"/><line x1="586" y1="800" x2="586" y2="846"/>
  </g>
  <!-- main shell -->
  <path d="M 90 50 H 710 Q 760 50 760 100 V 740 Q 760 785 715 785 H 85 Q 40 785 40 740 V 100 Q 40 50 90 50 Z" fill="url(#body)"/>
  <!-- stepped corner notches -->
  <path d="M 40 100 Q 40 50 90 50 H 130 V 96 H 40 Z" fill="#B3A89D"/>
  <path d="M 760 100 Q 760 50 710 50 H 670 V 96 H 760 Z" fill="#B3A89D"/>
  <path d="M 130 50 V 96 H 40" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
  <!-- grip ridges -->
  <g stroke-linecap="round">
    <line x1="170" y1="84" x2="630" y2="84" stroke="#8F847A" stroke-width="9"/><line x1="170" y1="78" x2="630" y2="78" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/><line x1="170" y1="112" x2="630" y2="112" stroke="#8F847A" stroke-width="9"/><line x1="170" y1="106" x2="630" y2="106" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/><line x1="170" y1="140" x2="630" y2="140" stroke="#8F847A" stroke-width="9"/><line x1="170" y1="134" x2="630" y2="134" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
  </g>
  <!-- label recess frame -->
  <rect x="120" y="190" width="560" height="420" rx="26" fill="url(#recess)"/>
  <rect x="124" y="194" width="552" height="412" rx="24" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="140" y="210" width="520" height="390" rx="14" fill="#E9E2D8"/>
  <!-- title plate -->
  <rect x="180" y="640" width="440" height="72" rx="16" fill="#B3A89D"/>
  <rect x="182" y="642" width="436" height="68" rx="15" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>
  <!-- screws / wear dots -->
  <circle cx="86" cy="735" r="11" fill="#9A8F85"/><circle cx="714" cy="735" r="11" fill="#9A8F85"/>
  <circle cx="86" cy="733" r="4" fill="#6F655D"/><circle cx="714" cy="733" r="4" fill="#6F655D"/>
</g>
<!-- light and shade, same direction in both variants -->
<rect x="0" y="0" width="800" height="900" fill="url(#light)" clip-path="url(#clip)"/>
<path d="M 90 50 H 710 Q 760 50 760 100 V 740 Q 760 785 715 785 H 85 Q 40 785 40 740 V 100 Q 40 50 90 50 Z"  fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="3"/>
</svg>
