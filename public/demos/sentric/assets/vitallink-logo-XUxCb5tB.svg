<svg xmlns="http://www.w3.org/2000/svg" viewBox="195 295 1040 330" width="1040" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="heartRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8212b"/>
      <stop offset="0.5" stop-color="#c8161f"/>
      <stop offset="1" stop-color="#8e0f16"/>
    </linearGradient>
    <linearGradient id="heartShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0d12" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7a0d12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crossBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a84d0"/>
      <stop offset="0.55" stop-color="#0060b0"/>
      <stop offset="1" stop-color="#00296e"/>
    </linearGradient>
    <linearGradient id="textBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a5eb0"/>
      <stop offset="1" stop-color="#003a80"/>
    </linearGradient>
    <linearGradient id="textRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4202a"/>
      <stop offset="1" stop-color="#a70f18"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="340" cy="598" rx="100" ry="7" fill="url(#shadow)"/>

  <!-- Wi-Fi arcs -->
  <g fill="none" stroke="#0a7bc4" stroke-width="10" stroke-linecap="round">
    <path d="M400,324 C450,313 490,335 507,369"/>
    <path d="M404,348 C440,340 476,355 488,384"/>
    <path d="M408,373 C432,368 455,380 464,398"/>
  </g>

  <!-- Heart -->
  <path d="M380,393 L380,552 Q360,570 335,588 Q250,540 222,490 Q208,440 235,408 Q262,385 295,393 Q322,398 343,415 Q360,396 380,393 Z" fill="url(#heartRed)"/>
  <path d="M380,393 L380,552 Q360,570 335,588 Q250,540 222,490 Q208,440 235,408 Q262,385 295,393 Q322,398 343,415 Q360,396 380,393 Z" fill="url(#heartShade)"/>

  <!-- Cross with white outline -->
  <path d="M388,393 H440 V453 H495 V515 H440 V575 H388 V515 H333 V453 H388 Z"
        fill="url(#crossBlue)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>

  <!-- ECG pulse line -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="228,490 262,490 268,470 280,511 298,428 318,523 326,500 337,455 383,455"/>
    <line x1="334" y1="487" x2="383" y2="487"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Open Sans','Segoe UI',Verdana,Arial,sans-serif" font-weight="800" font-style="italic" font-size="180">
    <text x="528" y="544" fill="url(#textBlue)" textLength="360" lengthAdjust="spacingAndGlyphs">Vital</text>
    <text x="886" y="544" fill="url(#textRed)" textLength="328" lengthAdjust="spacingAndGlyphs">Link</text>
  </g>

  <!-- Tagline -->
  <text x="546" y="598" fill="#6d6e71" font-family="'Open Sans','Segoe UI',Verdana,Arial,sans-serif"
        font-weight="700" font-style="italic" font-size="50" style="font-variant:small-caps"
        textLength="620" lengthAdjust="spacingAndGlyphs">Connect. Monitor. Respond.</text>
</svg>
